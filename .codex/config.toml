# .codex/config.toml — 프로젝트 개발 실행 기본값. 관리형 실행 정책은 별도다.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_fallback_filenames = ["CLAUDE.md"]
project_doc_max_bytes = 32768

[sandbox_workspace_write]
# 개발 단계 네트워크 사용 승인(2026-10-20). 활성 관리형 정책은 별도로 적용된다.
network_access = true

[[hooks.SessionStart]]

[[hooks.SessionStart.hooks]]
type = "command"
command = "node agents/scripts/handoff-inject.mjs --agent codex"
commandWindows = 'node agents\scripts\handoff-inject.mjs --agent codex'
timeout = 15
statusMessage = "인수인계·잠금 확인"

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "node agents/scripts/guard.mjs --agent codex"
commandWindows = 'node agents\scripts\guard.mjs --agent codex'
timeout = 180
statusMessage = "파괴 명령·커밋 전 검사"

# >>> GENERATED mcp_servers — agents/scripts/sync.mjs 가 agents/mcp.source.json 에서 만든다. 직접 편집 금지.

[mcp_servers.supabase]
command = "node"
args = ["node_modules/@supabase/mcp-server-supabase/dist/transports/stdio.js", "--project-ref=jajenrevcbmrpaliomxv", "--read-only"]
env_vars = ["SUPABASE_ACCESS_TOKEN"]

# <<< GENERATED mcp_servers

[mcp_servers.supabase.tools.execute_sql]
approval_mode = "approve"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "40"
