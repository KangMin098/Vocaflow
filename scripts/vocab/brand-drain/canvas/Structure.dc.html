<!doctype html>

    a { color: #7E5A1B; } a:hover { color: #1A1714; }

<div style="width: 480px; height: 640px; background: #2E7D5A; display: flex; flex-direction: column; box-sizing: border-box; position: relative;">

          <circle cx="149.7" cy="34.7" r="4.1" />
          <circle cx="71.9" cy="27.8" r="5.2" />

    <div style="display: flex; flex-direction: column; gap: 7px;">

        어원으로 익히는 1,500
