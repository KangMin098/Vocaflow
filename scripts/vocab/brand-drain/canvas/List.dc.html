<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
  <style>
    body { margin: 0; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7E5A1B; } a:hover { color: #1A1714; }
    .kicker { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    .serif { font-family: "Lora", serif; }
  </style>
</helmet>
<div style="width: 480px; height: 640px; background: #50697F; display: flex; flex-direction: column; box-sizing: border-box; position: relative;">
  <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(12,10,8,.30) 0%, rgba(12,10,8,.42) 100%);"></div>
  <div style="position: absolute; inset: 7%; border: 1px solid #E1E8EF; opacity: .30;"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; padding: 34px 34px 26px; box-sizing: border-box;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
      <span class="kicker" style="color: #E1E8EF; opacity: .85;">Vocaflow Vocabulary</span>
      <span class="num" style="font-size: 11px; color: #E1E8EF; opacity: .85;">VOL. 4</span>
    </div>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 0 0;">
      <svg width="240" height="195" viewBox="0 0 212 172" fill="none"
             stroke="#E1E8EF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             style="opacity: .62">
          <path d="M24 148 H188" />
          <path d="M24 148 V24" />
          <path d="M30 148 L30 119 L47.1 119 L47.1 148" />
          <path d="M62.8 148 L62.8 40 L79.9 40 L79.9 148" />
          <path d="M95.6 148 L95.6 47 L112.7 47 L112.7 148" />
          <path d="M128.4 148 L128.4 35 L145.5 35 L145.5 148" />
          <path d="M161.2 148 L161.2 65 L178.3 65 L178.3 148" />
          <path d="M28 104 H184" />
          <path d="M28 44.2 H184" />
          <path d="M28 105.7 H184" />
          
        </svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span class="kicker" style="color: #E1E8EF; opacity: .8;">LIST · 목록 계열</span>
      <h1 class="serif" style="margin: 0; font-size: 32px; line-height: 1.18; font-weight: 600; color: #FFFFFF; text-wrap: pretty;">
        어원으로 익히는 1,500
      </h1>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #E1E8EF; opacity: .78;">축적과 질서 — 세어서 줄 세운 것</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #E1E8EF33;">
      <span class="kicker" style="color: #E1E8EF; opacity: .7;">사다리</span>
      <div style="display: flex; gap: 6px;">
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">1</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">2</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">3</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">4</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; background: #E1E8EF; color: #50697F;">5</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">6</span>
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E1E8EF55; color: #E1E8EF; opacity: .8;">7</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
