<!doctype html>
<html>
<head>

  <script src="./support.js"></script>

<body>
<x-dc>

  <style>
    body { margin: 0; font-family: "DM Sans", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7E5A1B; } a:hover { color: #1A1714; }
    .kicker { font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; }
    .num { font-family: "JetBrains Mono", monospace; font-variant-numeric: tabular-nums; }
    .serif { font-family: "Lora", serif; }
  </style>
</helmet>
<div style="width: 480px; height: 640px; background: #0F2540; display: flex; flex-direction: column; box-sizing: border-box; position: relative;">

  <div style="position: absolute; inset: 7%; border: 1px solid #E3E8EE; opacity: .30;"></div>

  <div style="position: relative; display: flex; flex-direction: column; height: 100%; padding: 34px 34px 26px; box-sizing: border-box;">
    <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px;">
      <span class="kicker" style="color: #E3E8EE; opacity: .85;">Vocaflow Vocabulary</span>
      <span class="num" style="font-size: 11px; color: #E3E8EE; opacity: .85;">VOL. 4</span>
    </div>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px 0 0;">
      <svg width="240" height="195" viewBox="0 0 212 172" fill="none"
             stroke="#E3E8EE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
             style="opacity: .62">
          <path d="M106 28 A 58 58 0 1 1 106 28" />

          <path d="M106 138 L106 144" />
          <path d="M88.4 128.5 L83.8 139.6" />
          <path d="M69.2 122.8 L65 127" />
          <path d="M58 105.9 L52.4 108.2" />
          <path d="M60 86 L48 86" />
          <path d="M58 66.1 L52.4 63.8" />
          <path d="M69.2 49.2 L65 45" />
          <path d="M88.4 43.5 L83.8 32.4" />
          <path d="M106 86 L138.4 75.6" />
          <path d="M106 86 L60 84.4" />
          <circle cx="106" cy="86" r="3" />

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <span class="kicker" style="color: #E3E8EE; opacity: .8;">DELIVERY · 전달 계열</span>
      <h1 class="serif" style="margin: 0; font-size: 32px; line-height: 1.18; font-weight: 600; color: #FFFFFF; text-wrap: pretty;">
        어원으로 익히는 1,500
      </h1>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.6; color: #E3E8EE; opacity: .78;">리듬과 반복 — 매일 같은 자리로 돌아오는 것</p>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #E3E8EE33;">
      <span class="kicker" style="color: #E3E8EE; opacity: .7;">사다리</span>
      <div style="display: flex; gap: 6px;">
        <span class="num" style="font-size: 11px; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 3px; border: 1px solid #E3E8EE55; color: #E3E8EE; opacity: .8;">1</span>
