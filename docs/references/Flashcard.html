<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard — LexiVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --p:#3B82F6;--ph:#2563EB;--pl:#EFF6FF;--pd:#1D4ED8;
  --s:#22C55E;--sl:#DCFCE7;--e:#EF4444;--el:#FEE2E2;
  --a:#F59E0B;--al:#FEF3C7;
  --bg:#FFFFFF;--bg2:#F8FAFC;--bg3:#F1F5F9;
  --t1:#0F172A;--t2:#475569;--t3:#94A3B8;--t4:#CBD5E1;
  --bd:#E2E8F0;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-2xl:24px;--r-3xl:32px;--r-full:9999px;
  --sh-sm:0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --sh-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --sh-lg:0 10px 15px rgba(0,0,0,.10),0 4px 6px rgba(0,0,0,.05);
  --sh-xl:0 20px 25px rgba(0,0,0,.10),0 10px 10px rgba(0,0,0,.04);
  --es:cubic-bezier(.34,1.56,.64,1);
  --eo:cubic-bezier(0,0,.2,1);
}
[data-theme="dark"]{
  --p:#60A5FA;--ph:#93C5FD;--pl:#1E3A5F;--pd:#3B82F6;
  --bg:#0F172A;--bg2:#1E293B;--bg3:#334155;
  --t1:#F1F5F9;--t2:#CBD5E1;--t3:#64748B;--t4:#475569;
  --bd:#334155;--s:#4ADE80;--sl:#052e16;--e:#F87171;--el:#3b0a0a;
  --al:#3b2000;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--bg2);color:var(--t1);
  min-height:100%;display:flex;flex-direction:column;
  transition:background .2s,color .2s;
}
button{cursor:pointer;font-family:inherit;border:none;background:none;outline:none}

.app-shell{
  width:100%;max-width:480px;margin:0 auto;min-height:100vh;
  background:var(--bg);display:flex;flex-direction:column;
  box-shadow:0 0 60px rgba(0,0,0,.08);
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:var(--bg);border-bottom:1px solid var(--bd);
  position:sticky;top:0;z-index:50;
}
.brand{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:800;color:var(--p);display:flex;align-items:center;gap:6px}
.brand-dot{width:6px;height:6px;border-radius:50%;background:var(--p);box-shadow:0 0 0 3px var(--pl)}
.theme-btn{width:34px;height:34px;border-radius:var(--r-full);background:var(--bg2);border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:15px;transition:all .2s}
.theme-btn:hover{transform:rotate(20deg)}

/* ═══════════════════════
   START SCREEN
═══════════════════════ */
.start-screen{
  flex:1;display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}

/* 하늘 환경 */
.sky-env{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#87CEEB 0%,#56CCF2 45%,#2BBABA 80%,#1A9898 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:28px 20px 80px;flex-shrink:0;
}
/* 구름들 */
.cloud{position:absolute;background:rgba(255,255,255,.78);border-radius:50px;animation:cloudDrift linear infinite}
.c1{width:120px;height:38px;top:14px;left:-130px;animation-duration:18s}
.c2{width:90px; height:28px;top:24px;right:-100px;animation-duration:22s;animation-delay:-8s}
.c3{width:70px; height:22px;top:50px;left:-80px;animation-duration:26s;animation-delay:-14s}
.c4{width:100px;height:32px;top:10px;right:-110px;animation-duration:20s;animation-delay:-5s}
@keyframes cloudDrift{from{transform:translateX(0)}to{transform:translateX(700px)}}
/* 오른쪽 구름은 반대 */
.c2,.c4{animation-name:cloudDriftR}
@keyframes cloudDriftR{from{transform:translateX(0)}to{transform:translateX(-700px)}}

/* FLASHCARDS 레인보우 타이틀 */
.fc-logo{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(36px,9vw,46px);font-weight:900;
  letter-spacing:2px;line-height:1;margin-bottom:14px;
  position:relative;z-index:1;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.15));
}
.fc-logo span{display:inline-block}

/* 통계 pills */
.sky-pills{display:flex;gap:8px;margin-bottom:16px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center}
.sky-pill{
  background:rgba(255,255,255,.88);border-radius:var(--r-full);
  padding:5px 16px;font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:700;color:var(--t2);
  box-shadow:var(--sh-sm);
}

/* 시작 버튼들 */
.sky-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:1}
.sky-btn{
  padding:14px 24px;border-radius:var(--r-xl);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;
  box-shadow:var(--sh-lg);transition:all .15s;min-width:130px;
  position:relative;overflow:hidden;border:none;
}
.sky-btn::before{content:'';position:absolute;top:0;left:0;right:0;height:45%;background:rgba(255,255,255,.15);border-radius:var(--r-xl)}
.sky-btn:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(0,0,0,.18)}
.sky-btn:active{transform:translateY(1px)}
.sky-btn.blue{background:linear-gradient(135deg,#5B9CF6,#3B82F6,#2563EB);box-shadow:0 5px 0 #1D4ED8,var(--sh-lg)}
.sky-btn.purple{background:linear-gradient(135deg,#A78BFA,#8B5CF6,#7C3AED);box-shadow:0 5px 0 #5B21B6,var(--sh-lg)}
.sky-btn-label{font-size:15px;font-weight:800}
.sky-btn-sub{font-size:10px;opacity:.85}

/* 잔디 */
.grass{
  position:absolute;bottom:0;left:-8%;width:116%;height:90px;
  background:linear-gradient(180deg,#5CE870 0%,#40C050 30%,#2A9030 60%,#1A6020 100%);
  border-radius:50% 50% 0 0;
}
/* 잔디 풀잎 */
.grass::before{
  content:'';position:absolute;top:-18px;left:0;right:0;height:30px;
  background:
    radial-gradient(ellipse 28px 22px at  5% 100%,#6EF880 0%,transparent 70%),
    radial-gradient(ellipse 22px 18px at 12% 100%,#5EE870 0%,transparent 70%),
    radial-gradient(ellipse 32px 26px at 20% 100%,#72FA84 0%,transparent 70%),
    radial-gradient(ellipse 26px 20px at 30% 100%,#60E872 0%,transparent 70%),
    radial-gradient(ellipse 30px 24px at 40% 100%,#6EF880 0%,transparent 70%),
    radial-gradient(ellipse 24px 18px at 50% 100%,#5CE870 0%,transparent 70%),
    radial-gradient(ellipse 28px 22px at 60% 100%,#70FA82 0%,transparent 70%),
    radial-gradient(ellipse 26px 20px at 70% 100%,#5EE870 0%,transparent 70%),
    radial-gradient(ellipse 32px 25px at 80% 100%,#72F880 0%,transparent 70%),
    radial-gradient(ellipse 22px 18px at 90% 100%,#62E872 0%,transparent 70%),
    radial-gradient(ellipse 28px 22px at 98% 100%,#6EF880 0%,transparent 70%);
}

/* 시작화면 하단 정보 */
.start-info{
  background:var(--bg);padding:20px;
  display:flex;flex-direction:column;gap:12px;
}
.mode-tabs{display:flex;gap:0;border:1.5px solid var(--bd);border-radius:var(--r-lg);overflow:hidden}
.mode-tab{
  flex:1;padding:10px;font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;font-weight:700;color:var(--t3);
  background:var(--bg);transition:all .15s;text-align:center;
}
.mode-tab.active{background:var(--pl);color:var(--p)}
.mode-tab:not(:last-child){border-right:1.5px solid var(--bd)}

/* ═══════════════════════
   GAME SCREEN
═══════════════════════ */
.game-screen{flex:1;display:none;flex-direction:column}

/* 진행 헤더 */
.fc-header{
  padding:12px 16px;background:var(--bg);
  border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;
}
.fc-prog-wrap{flex:1}
.fc-prog-row{display:flex;justify-content:space-between;font-family:'DM Sans',sans-serif;font-size:11px;color:var(--t3);margin-bottom:5px}
.fc-prog-track{height:5px;background:var(--bg3);border-radius:99px;overflow:hidden}
.fc-prog-fill{height:100%;background:var(--p);border-radius:99px;transition:width .4s var(--eo)}
.fc-counter{
  font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;
  color:var(--t1);flex-shrink:0;min-width:48px;text-align:right;
}

/* 하늘 게임 환경 */
.fc-sky{
  flex:1;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#87CEEB 0%,#56CCF2 50%,#2BBABA 100%);
  display:flex;flex-direction:column;align-items:center;
  padding:20px 16px 90px;
}
.fc-sky-cloud{position:absolute;background:rgba(255,255,255,.72);border-radius:50px}
.fc-sky-cloud.a{width:100px;height:30px;top:14px;left:12px}
.fc-sky-cloud.b{width:80px; height:24px;top:18px;right:16px}

/* 카드 flip scene */
.fc-scene{width:100%;max-width:380px;perspective:1200px;margin-bottom:18px;position:relative;z-index:2}
.fc-card{
  width:100%;aspect-ratio:3/4;position:relative;
  transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.4,0,.2,1);
  cursor:pointer;
}
.fc-card.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--r-3xl);
  box-shadow:var(--sh-xl),0 0 0 1px rgba(255,255,255,.2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 28px;
}
/* 앞면 */
.fc-front{
  background:linear-gradient(145deg,#FFFDE7 0%,#FFF9C4 50%,#FFF59D 100%);
}
.fc-front-deco{position:absolute;top:16px;right:20px;font-size:20px;opacity:.4}
.fc-front-deco2{position:absolute;bottom:16px;left:18px;font-size:16px;opacity:.3}
/* 뒷면 */
.fc-back{
  background:linear-gradient(145deg,#E8F5E9 0%,#C8E6C9 50%,#A5D6A7 100%);
  transform:rotateY(180deg);
}
/* 영어 단어 */
.fc-word{
  font-family:'Lora',serif;font-size:clamp(28px,8vw,36px);font-weight:700;
  color:var(--t1);text-align:center;letter-spacing:-.01em;
  margin-bottom:10px;line-height:1.2;
}
/* 품사 */
.fc-pos{
  font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
  color:var(--t3);background:rgba(0,0,0,.07);
  padding:3px 14px;border-radius:var(--r-full);margin-bottom:8px;
}
/* 힌트 (앞면) */
.fc-hint{
  font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t3);
  text-align:center;position:absolute;bottom:24px;
  display:flex;align-items:center;gap:4px;
}
/* 뜻 */
.fc-meaning{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(18px,5vw,24px);font-weight:700;
  color:#065f46;text-align:center;line-height:1.35;margin-bottom:10px;
}
[data-theme="dark"] .fc-meaning{color:#4ADE80}
/* 예문 */
.fc-example{
  font-family:'Lora',serif;font-size:13px;font-style:italic;
  color:#1a5c38;text-align:center;line-height:1.65;
  background:rgba(255,255,255,.45);border-radius:var(--r-lg);
  padding:10px 14px;max-width:100%;
}
[data-theme="dark"] .fc-example{color:#86EFAC;background:rgba(255,255,255,.1)}
.fc-example-hl{font-weight:700;font-style:normal;color:#0d4428}
[data-theme="dark"] .fc-example-hl{color:#4ADE80}

/* 탭 힌트 */
.fc-tap-hint{
  font-family:'DM Sans',sans-serif;font-size:12px;color:rgba(255,255,255,.7);
  display:flex;align-items:center;gap:5px;margin-bottom:10px;position:relative;z-index:2;
  animation:tapHint 2s ease-in-out infinite;
}
@keyframes tapHint{0%,100%{opacity:.5}50%{opacity:1}}

/* 정답/오답 버튼 */
.fc-answer-btns{
  display:flex;gap:12px;justify-content:center;position:relative;z-index:2;
  opacity:0;pointer-events:none;transition:all .3s;
}
.fc-answer-btns.show{opacity:1;pointer-events:auto}
.fc-ans{
  padding:13px 28px;border-radius:var(--r-xl);
  font-family:'DM Sans',sans-serif;font-size:14px;font-weight:700;
  color:#fff;display:flex;align-items:center;gap:7px;
  box-shadow:var(--sh-md);transition:all .15s;border:none;
  min-width:130px;justify-content:center;
}
.fc-ans:hover{transform:translateY(-2px);box-shadow:var(--sh-lg)}
.fc-ans:active{transform:translateY(1px)}
.fc-ans.known{background:linear-gradient(135deg,#22c55e,#16a34a);box-shadow:0 4px 0 #15803d,var(--sh-md)}
.fc-ans.unknown{background:linear-gradient(135deg,#f97316,#ef4444);box-shadow:0 4px 0 #b91c1c,var(--sh-md)}

/* 게임 잔디 */
.fc-grass{
  position:absolute;bottom:0;left:-8%;width:116%;height:80px;
  background:linear-gradient(180deg,#5CE870 0%,#40C050 40%,#2A9030 100%);
  border-radius:50% 50% 0 0;
}

/* 빠른 피드백 */
.fc-feedback{
  position:absolute;inset:0;z-index:30;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .1s;
}
.fc-feedback.show{opacity:1}
.fc-fb-chip{
  font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;
  padding:10px 22px;border-radius:var(--r-full);
  box-shadow:var(--sh-xl);
  animation:chipPop .3s var(--es);
  letter-spacing:.01em;
}
.fc-fb-chip.ok{background:var(--sl);color:#15803d;border:2px solid var(--s)}
.fc-fb-chip.no{background:var(--el);color:#991b1b;border:2px solid var(--e)}
@keyframes chipPop{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}

/* ═══════════════════════
   RESULT SCREEN
═══════════════════════ */
.result-screen{flex:1;display:none;flex-direction:column;overflow:hidden}

/* 결과 하늘 */
.result-sky{
  background:linear-gradient(180deg,#87CEEB 0%,#56CCF2 60%,#2BBABA 100%);
  padding:28px 20px 50px;display:flex;flex-direction:column;align-items:center;
  position:relative;overflow:hidden;flex-shrink:0;
}
.result-sky-cloud{position:absolute;background:rgba(255,255,255,.7);border-radius:50px}
.rsc-a{width:90px;height:28px;top:10px;left:10px}
.rsc-b{width:70px;height:22px;top:16px;right:12px}
.result-trophy{font-size:52px;display:block;margin-bottom:8px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
.result-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:24px;font-weight:800;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.2);margin-bottom:2px}
.result-sub{font-family:'DM Sans',sans-serif;font-size:13px;color:rgba(255,255,255,.85)}
.result-grass{position:absolute;bottom:0;left:-8%;width:116%;height:60px;background:linear-gradient(180deg,#5CE870,#2A9030);border-radius:50% 50% 0 0}

.result-body{
  flex:1;overflow-y:auto;padding:20px 16px;
  background:var(--bg);display:flex;flex-direction:column;gap:14px;
}
/* SVG 점수 링 */
.ring-wrap{display:flex;justify-content:center;margin-bottom:4px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:var(--p);line-height:1}
.ring-sub{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--t3);margin-top:3px}
.ring-container{position:relative;display:inline-flex}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.st-card{text-align:center;padding:14px 8px;border-radius:var(--r-xl)}
.st-card.g{background:var(--sl);border:1px solid #A7F3D0}
.st-card.r{background:var(--el);border:1px solid #FCA5A5}
.st-card.n{background:var(--bg2);border:1px solid var(--bd)}
.st-lbl{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t3);margin-bottom:5px}
.st-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:30px;font-weight:800;line-height:1}
.st-card.g .st-val{color:var(--s)}
.st-card.r .st-val{color:var(--e)}
.st-card.n .st-val{color:var(--t1);font-size:22px}

/* 틀린 카드 목록 */
.fc-wrong-panel{border:1px solid var(--bd);border-radius:var(--r-xl);overflow:hidden}
.fc-wrong-hdr{padding:11px 16px;background:var(--bg2);border-bottom:1px solid var(--bd);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--t3)}
.fc-wrong-row{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--bg3)}
.fc-wrong-row:last-child{border-bottom:none}
.fwr-icon{width:32px;height:32px;background:var(--el);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fwr-word{font-family:'Lora',serif;font-size:15px;font-weight:600;color:var(--t1)}
.fwr-meaning{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--t3)}

.result-btns{display:flex;gap:10px}
.rbtn{flex:1;padding:13px;font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;border-radius:var(--r-full);transition:all .15s}
.rbtn.s{border:2px solid var(--p);color:var(--p);background:transparent}
.rbtn.s:hover{background:var(--pl)}
.rbtn.p{color:#fff;background:var(--p);border:none;box-shadow:0 3px 0 var(--pd)}
.rbtn.p:hover{background:var(--ph);transform:translateY(-1px);box-shadow:0 5px 0 var(--pd)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--bd);border-radius:99px}
</style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <div class="brand"><div class="brand-dot"></div>LexiVault</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- ① START SCREEN -->
  <div class="start-screen" id="startScreen">
    <div class="sky-env">
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="cloud c3"></div><div class="cloud c4"></div>

      <!-- FLASHCARDS 레인보우 -->
      <div class="fc-logo">
        <span style="color:#ef4444">F</span><span style="color:#f97316">L</span>
        <span style="color:#eab308">A</span><span style="color:#22c55e">S</span>
        <span style="color:#3b82f6">H</span><span style="color:#8b5cf6">C</span>
        <span style="color:#ef4444">A</span><span style="color:#f97316">R</span>
        <span style="color:#eab308">D</span><span style="color:#22c55e">S</span>
      </div>

      <div class="sky-pills">
        <span class="sky-pill">📚 새 카드 <span id="newCount">12</span>개</span>
        <span class="sky-pill">🔄 복습 <span id="reviewCount">0</span>개</span>
        <span class="sky-pill">⭐ SM-2 SRS</span>
      </div>

      <div class="sky-btns">
        <button class="sky-btn blue" onclick="startGame('word')">
          <span class="sky-btn-label">🔤 단어로</span>
          <span class="sky-btn-sub">▶ 영어 → 한국어</span>
        </button>
        <button class="sky-btn purple" onclick="startGame('meaning')">
          <span class="sky-btn-label">📝 뜻으로</span>
          <span class="sky-btn-sub">▶ 한국어 → 영어</span>
        </button>
      </div>
      <div class="grass"></div>
    </div>

    <div class="start-info">
      <div class="mode-tabs">
        <div class="mode-tab active">📖 오늘의 단어장</div>
        <div class="mode-tab">⭐ 즐겨찾기만</div>
        <div class="mode-tab">🔄 모두 복습</div>
      </div>
    </div>
  </div>

  <!-- ② GAME SCREEN -->
  <div class="game-screen" id="gameScreen">
    <!-- 진행 헤더 -->
    <div class="fc-header">
      <div class="fc-prog-wrap">
        <div class="fc-prog-row">
          <span>학습 진행</span>
          <span id="progLabel">0 / 12</span>
        </div>
        <div class="fc-prog-track">
          <div class="fc-prog-fill" id="progFill" style="width:0%"></div>
        </div>
      </div>
      <div class="fc-counter" id="counterDisp">0</div>
    </div>

    <!-- 하늘 환경 -->
    <div class="fc-sky">
      <div class="fc-sky-cloud a"></div>
      <div class="fc-sky-cloud b"></div>

      <!-- 탭 힌트 -->
      <div class="fc-tap-hint" id="tapHint">
        <span>👆</span><span>카드를 탭하면 뒤집혀요</span>
      </div>

      <!-- 카드 flip -->
      <div class="fc-scene">
        <div class="fc-card" id="fcCard" onclick="flipCard()">
          <!-- 앞면 -->
          <div class="fc-face fc-front">
            <span class="fc-front-deco">✦</span>
            <span class="fc-front-deco2">◇</span>
            <div class="fc-word" id="frontWord">evolution</div>
            <div class="fc-pos" id="frontPos">noun</div>
            <div class="fc-hint">👆 탭해서 뜻 확인</div>
          </div>
          <!-- 뒷면 -->
          <div class="fc-face fc-back">
            <div class="fc-meaning" id="backMeaning">진화, 발전</div>
            <div class="fc-example" id="backExample">
              Natural <span class="fc-example-hl">evolution</span> determines which traits survive.
            </div>
          </div>
        </div>
        <!-- 피드백 오버레이 -->
        <div class="fc-feedback" id="fcFeedback">
          <div class="fc-fb-chip" id="fcFbChip"></div>
        </div>
      </div>

      <!-- 정답/오답 버튼 -->
      <div class="fc-answer-btns" id="answerBtns">
        <button class="fc-ans unknown" onclick="answer(false)">✗ 모르겠어요</button>
        <button class="fc-ans known"   onclick="answer(true)">✓ 알아요</button>
      </div>

      <div class="fc-grass"></div>
    </div>
  </div>

  <!-- ③ RESULT SCREEN -->
  <div class="result-screen" id="resultScreen">
    <div class="result-sky">
      <div class="result-sky-cloud rsc-a"></div>
      <div class="result-sky-cloud rsc-b"></div>
      <span class="result-trophy" id="rTrophy">🏆</span>
      <div class="result-title" id="rTitle">학습 완료!</div>
      <div class="result-sub" id="rSub">오늘도 훌륭해요!</div>
      <div class="result-grass"></div>
    </div>

    <div class="result-body">
      <!-- 점수 링 -->
      <div class="ring-wrap">
        <div class="ring-container">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="54" fill="none" stroke="var(--bg3)" stroke-width="9"/>
            <circle cx="65" cy="65" r="54" fill="none" stroke="var(--p)" stroke-width="9"
              stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"
              transform="rotate(-90 65 65)" id="scoreRing"
              style="transition:stroke-dashoffset 1s var(--eo)"/>
          </svg>
          <div class="ring-center">
            <div class="ring-val" id="ringVal">0%</div>
            <div class="ring-sub">정확도</div>
          </div>
        </div>
      </div>

      <div class="stats-grid">
        <div class="st-card g"><div class="st-lbl">✓ 알아요</div><div class="st-val" id="rKnown">0</div></div>
        <div class="st-card r"><div class="st-lbl">✗ 모르겠어요</div><div class="st-val" id="rUnknown">0</div></div>
        <div class="st-card n"><div class="st-lbl">📚 총 카드</div><div class="st-val" id="rTotal">0</div></div>
      </div>

      <div class="fc-wrong-panel" id="wrongPanel" style="display:none">
        <div class="fc-wrong-hdr">🔄 다시 볼 단어</div>
        <div id="wrongList"></div>
      </div>

      <div class="result-btns">
        <button class="rbtn s" onclick="restartGame()">🔄 다시 학습</button>
        <button class="rbtn p" onclick="goNext()">📖 단어장 보기</button>
      </div>
    </div>
  </div>
</div>

<script>
var CARDS=[
  {word:'evolution',   pos:'noun', meaning:'진화, 발전',      example:'Natural <b>evolution</b> determines which traits survive in species over generations.'},
  {word:'organism',    pos:'noun', meaning:'유기체, 생물',     example:'Each <b>organism</b> must adapt to its environment or face extinction.'},
  {word:'fossil',      pos:'noun', meaning:'화석',              example:'Scientists study <b>fossils</b> to understand prehistoric life on Earth.'},
  {word:'adaptation',  pos:'noun', meaning:'적응',              example:'The thick fur is an <b>adaptation</b> to survive in cold climates.'},
  {word:'selection',   pos:'noun', meaning:'자연선택, 선발',    example:'Natural <b>selection</b> favors traits that improve survival and reproduction.'},
  {word:'mutation',    pos:'noun', meaning:'돌연변이',          example:'A single <b>mutation</b> can sometimes lead to significant evolutionary changes.'},
  {word:'species',     pos:'noun', meaning:'종(種)',             example:'There are millions of <b>species</b> living on Earth today.'},
  {word:'habitat',     pos:'noun', meaning:'서식지',             example:'Deforestation destroys the natural <b>habitat</b> of countless animals.'},
  {word:'predator',    pos:'noun', meaning:'포식자',             example:'The lion is a top <b>predator</b> in the African savanna ecosystem.'},
  {word:'trait',       pos:'noun', meaning:'형질, 특성',         example:'Eye color is a genetic <b>trait</b> inherited from your parents.'},
  {word:'extinct',     pos:'adj',  meaning:'멸종된',             example:'The dodo bird became <b>extinct</b> in the late 17th century.'},
  {word:'migrate',     pos:'verb', meaning:'이주하다',           example:'Many birds <b>migrate</b> south in winter to escape the cold.'},
];

var st={
  queue:[],idx:0,cur:null,mode:'word',
  flipped:false,known:0,unknown:0,
  wrongItems:[],busy:false,
};
function $(id){return document.getElementById(id)}
function toggleTheme(){
  var d=document.documentElement;
  var dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',dark?'light':'dark');
  $('themeBtn').textContent=dark?'🌙':'☀️';
}
function startGame(mode){
  st.mode=mode||'word';
  st.queue=CARDS.slice().sort(function(){return Math.random()-.5});
  st.idx=0;st.known=0;st.unknown=0;st.wrongItems=[];
  $('startScreen').style.display='none';
  $('resultScreen').style.display='none';
  $('gameScreen').style.display='flex';
  loadCard();
}
function loadCard(){
  if(st.idx>=st.queue.length){endGame();return}
  st.cur=st.queue[st.idx];st.flipped=false;st.busy=false;
  var card=$('fcCard');
  card.classList.remove('flipped');
  // 뒤집기 방지 중 교체
  setTimeout(function(){
    if(st.mode==='word'){
      $('frontWord').textContent=st.cur.word;
      $('frontPos').textContent=st.cur.pos;
      $('backMeaning').textContent=st.cur.meaning;
      $('backExample').innerHTML=st.cur.example;
    } else {
      $('frontWord').textContent=st.cur.meaning;
      $('frontPos').textContent='뜻 → 영단어';
      $('backMeaning').textContent=st.cur.word;
      $('backExample').innerHTML=st.cur.example;
    }
  },280);
  $('answerBtns').classList.remove('show');
  $('tapHint').style.display='flex';
  updateProgress();
}
function flipCard(){
  if(st.busy)return;
  var card=$('fcCard');
  card.classList.toggle('flipped');
  st.flipped=!st.flipped;
  if(st.flipped){
    $('answerBtns').classList.add('show');
    $('tapHint').style.display='none';
  } else {
    $('answerBtns').classList.remove('show');
    $('tapHint').style.display='flex';
  }
}
function answer(known){
  if(st.busy||!st.flipped)return;
  st.busy=true;
  if(known){st.known++}
  else{st.unknown++;st.wrongItems.push(st.cur)}
  showFeedback(known);
  setTimeout(function(){
    $('fcFeedback').classList.remove('show');
    st.idx++;loadCard();
  },700);
}
function showFeedback(ok){
  var fb=$('fcFeedback'),chip=$('fcFbChip');
  chip.className='fc-fb-chip '+(ok?'ok':'no');
  chip.textContent=ok?'✓ 알아요!':'✗ 다음에 다시';
  chip.style.animation='none';
  setTimeout(function(){chip.style.animation=''},10);
  fb.classList.add('show');
}
function updateProgress(){
  var total=st.queue.length,done=st.idx;
  $('progFill').style.width=(done/total*100)+'%';
  $('progLabel').textContent=done+' / '+total;
  $('counterDisp').textContent=done;
}
function endGame(){
  $('gameScreen').style.display='none';
  var rs=$('resultScreen');rs.style.display='flex';
  var total=st.queue.length;
  var pct=Math.round(st.known/total*100);
  var trophy,title,sub;
  if(pct>=90){trophy='🏆';title='완벽해요!';sub='모든 단어를 마스터했어요!'}
  else if(pct>=70){trophy='🌟';title='훌륭해요!';sub='조금만 더 연습하면 완벽해요!'}
  else if(pct>=50){trophy='💪';title='잘 하고 있어요!';sub='모르는 단어를 다시 복습해봐요.'}
  else{trophy='📖';title='계속 연습해요!';sub='반복 학습이 실력을 키워요!'}
  $('rTrophy').textContent=trophy;$('rTitle').textContent=title;$('rSub').textContent=sub;
  $('rKnown').textContent=st.known;$('rUnknown').textContent=st.unknown;$('rTotal').textContent=total;$('ringVal').textContent=pct+'%';
  setTimeout(function(){
    $('scoreRing').style.strokeDashoffset=339.3*(1-st.known/total);
  },100);
  if(st.wrongItems.length){
    $('wrongPanel').style.display='block';
    $('wrongList').innerHTML=st.wrongItems.map(function(c){
      return '<div class="fc-wrong-row"><div class="fwr-icon">✕</div><div><div class="fwr-word">'+c.word+'</div><div class="fwr-meaning">'+c.meaning+'</div></div></div>';
    }).join('');
  }
}
function restartGame(){startGame(st.mode)}
function goNext(){alert('단어장 화면으로 이동합니다.')}
$('newCount').textContent=CARDS.length;
</script>
</body>
</html>
