<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScriptQuiz — LexiVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── CLAUDE.md CSS Variables ── */
:root {
  --color-primary:       #3B82F6;
  --color-primary-hover: #2563EB;
  --color-primary-light: #EFF6FF;
  --color-primary-dark:  #1D4ED8;
  --color-active:        #F59E0B;
  --color-active-light:  #FEF3C7;
  --color-success:       #22C55E;
  --color-success-light: #DCFCE7;
  --color-error:         #EF4444;
  --color-error-light:   #FEE2E2;
  --color-bg:            #FFFFFF;
  --color-bg-secondary:  #F8FAFC;
  --color-bg-tertiary:   #F1F5F9;
  --color-text:          #0F172A;
  --color-text-secondary:#475569;
  --color-text-muted:    #94A3B8;
  --color-text-disabled: #CBD5E1;
  --color-border:        #E2E8F0;
  --color-border-focus:  #3B82F6;
  --radius-sm:  6px;  --radius-md:  8px;
  --radius-lg:  12px; --radius-xl:  16px;
  --radius-2xl: 24px; --radius-full:9999px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.06);
  --shadow-md: 0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 15px rgba(0,0,0,.10),0 4px 6px rgba(0,0,0,.05);
  --shadow-xl: 0 20px 25px rgba(0,0,0,.10),0 10px 10px rgba(0,0,0,.04);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
  --ease-out:    cubic-bezier(0,0,.2,1);
}
[data-theme="dark"] {
  --color-primary:       #60A5FA;
  --color-primary-hover: #93C5FD;
  --color-primary-light: #1E3A5F;
  --color-primary-dark:  #3B82F6;
  --color-bg:            #0F172A;
  --color-bg-secondary:  #1E293B;
  --color-bg-tertiary:   #334155;
  --color-text:          #F1F5F9;
  --color-text-secondary:#CBD5E1;
  --color-text-muted:    #64748B;
  --color-border:        #334155;
  --color-border-focus:  #60A5FA;
  --color-success:       #4ADE80;
  --color-success-light: #052e16;
  --color-error:         #F87171;
  --color-error-light:   #3b0a0a;
  --color-active-light:  #3b2000;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{height:100%;-webkit-text-size-adjust:100%}
body{
  font-family:'DM Sans',system-ui,sans-serif;
  background:var(--color-bg-secondary);
  color:var(--color-text);
  min-height:100%;
  display:flex;flex-direction:column;
  transition:background .2s,color .2s;
}
button{cursor:pointer;font-family:inherit;border:none;background:none;outline:none}

/* ── 앱 셸 ── */
.app-shell{
  width:100%;max-width:480px;margin:0 auto;
  min-height:100vh;
  background:var(--color-bg);
  display:flex;flex-direction:column;
  position:relative;
  box-shadow:0 0 60px rgba(0,0,0,.08);
}

/* ── 상단 바 ── */
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;
  background:var(--color-bg);
  border-bottom:1px solid var(--color-border);
  position:sticky;top:0;z-index:50;
}
.top-bar-brand{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:13px;font-weight:800;color:var(--color-primary);
  letter-spacing:-.02em;display:flex;align-items:center;gap:6px;
}
.top-bar-brand-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--color-primary);
  box-shadow:0 0 0 3px var(--color-primary-light);
}
.theme-btn{
  width:34px;height:34px;border-radius:var(--radius-full);
  background:var(--color-bg-secondary);border:1px solid var(--color-border);
  display:flex;align-items:center;justify-content:center;font-size:15px;
  transition:all .2s;
}
.theme-btn:hover{transform:rotate(20deg)}

/* ═══════════════════════════════════
   START SCREEN
═══════════════════════════════════ */
.start-screen{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 28px 60px;
  border:4px solid var(--color-primary);
  border-top:none;
}

/* QUIZ 타이틀 — gradient + 입체 */
.quiz-logo-wrap{position:relative;margin-bottom:10px;text-align:center}
.quiz-logo{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:clamp(60px,15vw,76px);font-weight:900;
  line-height:1;letter-spacing:-.02em;
  background:linear-gradient(180deg,#5BC8F5 0%,#29A8E0 40%,#1A7AB8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  filter:drop-shadow(0 5px 0 rgba(25,100,160,.28))
         drop-shadow(0 8px 16px rgba(59,130,246,.2));
  display:inline-block;
}
.quiz-logo-icons{
  position:absolute;right:-16px;top:4px;
  display:flex;flex-direction:column;align-items:center;gap:0;
}
.quiz-logo-book{font-size:30px;line-height:1}
.quiz-logo-pencil{font-size:18px;transform:rotate(-15deg);margin-top:-4px}
.quiz-logo-q{
  position:absolute;top:-6px;right:-30px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:28px;font-weight:900;
  color:var(--color-text-muted);
}

/* 원문 정보 카드 */
.script-info-card{
  background:var(--color-bg-secondary);
  border:1px solid var(--color-border);
  border-radius:var(--radius-xl);
  padding:20px 24px;width:100%;margin-bottom:28px;
  text-align:center;
}
.script-info-label{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--color-text-muted);margin-bottom:10px;
}
.script-info-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:18px;font-weight:700;color:var(--color-text);
  margin-bottom:3px;
}
.script-info-chapter{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:16px;font-weight:600;color:var(--color-text-secondary);
  margin-bottom:2px;
}
.script-info-section{
  font-family:'DM Sans',sans-serif;
  font-size:13px;color:var(--color-text-muted);
}

/* 메타 배지들 */
.meta-badges{
  display:flex;align-items:center;gap:8px;
  margin-bottom:28px;flex-wrap:wrap;justify-content:center;
}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;
  padding:5px 12px;border-radius:var(--radius-full);
}
.badge-blue{background:var(--color-primary-light);color:var(--color-primary)}
.badge-gray{background:var(--color-bg-tertiary);color:var(--color-text-muted)}
.badge-green{background:var(--color-success-light);color:#065f46}
[data-theme="dark"] .badge-green{color:#4ADE80}

/* Start 버튼 */
.start-btn{
  padding:16px 60px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:700;
  color:#fff;background:var(--color-primary);
  border-radius:var(--radius-full);
  box-shadow:0 5px 0 var(--color-primary-dark),
             0 8px 24px rgba(59,130,246,.35);
  transition:all .15s;
  position:relative;overflow:hidden;
}
.start-btn::before{
  content:'';position:absolute;top:0;left:0;right:0;height:45%;
  background:rgba(255,255,255,.12);border-radius:var(--radius-full);
}
.start-btn:hover{
  background:var(--color-primary-hover);
  transform:translateY(-3px);
  box-shadow:0 8px 0 var(--color-primary-dark),0 12px 28px rgba(59,130,246,.4);
}
.start-btn:active{
  transform:translateY(2px);
  box-shadow:0 3px 0 var(--color-primary-dark),0 4px 12px rgba(59,130,246,.2);
}

/* ═══════════════════════════════════
   GAME SCREEN — HUD
═══════════════════════════════════ */
.game-screen{flex:1;display:none;flex-direction:column}

.hud{
  display:flex;align-items:center;gap:12px;
  padding:10px 16px;
  background:var(--color-primary);
  flex-shrink:0;
}
.hud-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:14px;font-weight:700;color:rgba(255,255,255,.92);flex:1;
}
.hud-group{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.15);border-radius:var(--radius-md);
  padding:5px 10px;
}
.hud-ico{font-size:14px}
.hud-lbl{
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
  color:rgba(255,255,255,.8);
}
.hud-val{
  font-family:'JetBrains Mono',monospace;
  font-size:20px;font-weight:700;color:#fff;
  min-width:52px;text-align:right;
}
.hud-val.danger{color:#FCD34D}

/* 진행 바 */
.progress-wrap{
  height:4px;background:rgba(255,255,255,.2);flex-shrink:0;
}
.progress-fill{
  height:100%;background:rgba(255,255,255,.7);
  transition:width .5s var(--ease-out);
}

/* ── 문제 영역 ── */
.question-wrap{
  flex:1;overflow-y:auto;
  padding:16px 16px 24px;
  display:flex;flex-direction:column;gap:14px;
  position:relative;
}

/* 문제 번호 + 유형 */
.q-meta{
  display:flex;align-items:center;justify-content:space-between;
}
.q-num{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--color-text-muted);
}
.q-type-badge{
  font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:var(--radius-full);
  background:var(--color-primary-light);color:var(--color-primary);
}

/* 문제 박스 */
.q-box{
  background:var(--color-bg-secondary);
  border:1.5px solid var(--color-border);
  border-radius:var(--radius-xl);
  padding:18px 20px;
}
.q-text{
  font-family:'Lora',serif;
  font-size:17px;font-weight:600;
  color:var(--color-text);line-height:1.65;
}
.q-hint{
  font-family:'DM Sans',sans-serif;
  font-size:12px;color:var(--color-text-muted);
  margin-top:8px;
}

/* ── 선택지 ── */
.options{display:flex;flex-direction:column;gap:10px}
.option{
  display:flex;align-items:center;gap:11px;
  padding:14px 16px;
  border-radius:var(--radius-xl);
  border:2px solid var(--color-border);
  background:var(--color-bg);
  cursor:pointer;text-align:left;width:100%;
  transition:all .15s;
  position:relative;overflow:hidden;
}
.option::before{
  content:'';position:absolute;inset:0;
  background:rgba(59,130,246,0);
  transition:background .15s;
}
.option:hover:not(:disabled){
  border-color:var(--color-primary);
  background:var(--color-primary-light);
}
.option.sel{
  border-color:var(--color-primary);
  background:var(--color-primary-light);
}
.option.correct{
  border-color:var(--color-success);
  background:var(--color-success-light);
  animation:correctPulse .4s var(--ease-spring);
}
.option.wrong{
  border-color:var(--color-error);
  background:var(--color-error-light);
  animation:wrongShake .35s ease;
}
.option.dim{opacity:.35;pointer-events:none}

@keyframes correctPulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.025)}
  100%{transform:scale(1)}
}
@keyframes wrongShake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(7px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(4px)}
}

/* 체크박스 */
.opt-chk{
  width:22px;height:22px;border-radius:5px;flex-shrink:0;
  border:2px solid var(--color-border);background:var(--color-bg);
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.option.sel  .opt-chk{background:var(--color-primary);border-color:var(--color-primary)}
.option.correct .opt-chk{background:var(--color-success);border-color:var(--color-success)}
.option.wrong   .opt-chk{background:var(--color-error);border-color:var(--color-error)}

/* 레이블 뱃지 */
.opt-lbl{
  width:24px;height:24px;border-radius:50%;flex-shrink:0;
  background:var(--color-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;
  transition:background .15s;
}
.option.correct .opt-lbl{background:var(--color-success)}
.option.wrong   .opt-lbl{background:var(--color-error)}
.option.dim     .opt-lbl{background:var(--color-text-muted)}

/* 선택지 텍스트 */
.opt-text{
  flex:1;
  font-family:'Lora',serif;font-size:14.5px;font-weight:400;
  color:var(--color-text);line-height:1.55;
}

/* ── Next 버튼 ── */
.next-wrap{padding:0 16px 16px;flex-shrink:0}
.next-btn{
  width:100%;padding:14px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;
  border-radius:var(--radius-full);border:2px solid var(--color-border);
  background:var(--color-bg);color:var(--color-text-muted);
  cursor:not-allowed;transition:all .2s;
}
.next-btn.active{
  border-color:var(--color-primary);color:var(--color-primary);cursor:pointer;
}
.next-btn.active:hover{
  background:var(--color-primary);color:#fff;
  box-shadow:0 4px 14px rgba(59,130,246,.35);
}

/* ═══════════════════════════════════
   O/X 피드백 오버레이
═══════════════════════════════════ */
.feedback-layer{
  position:absolute;inset:0;z-index:30;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
  opacity:0;transition:opacity .1s;
}
.feedback-layer.show{opacity:1}
.feedback-box{
  width:136px;height:136px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px) saturate(160%);
  -webkit-backdrop-filter:blur(8px) saturate(160%);
  border-radius:var(--radius-2xl);
  box-shadow:var(--shadow-xl);
  display:flex;align-items:center;justify-content:center;
  animation:fbPop .32s var(--ease-spring);
}
[data-theme="dark"] .feedback-box{
  background:rgba(15,23,42,.92);
}
.fb-o{
  width:84px;height:84px;border-radius:50%;
  border:10px solid var(--color-primary);opacity:.65;
}
.fb-x{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:76px;font-weight:900;line-height:1;
  color:var(--color-error);opacity:.72;
}
@keyframes fbPop{
  from{opacity:0;transform:scale(.4) rotate(-5deg)}
  to  {opacity:1;transform:scale(1) rotate(0)}
}

/* ═══════════════════════════════════
   RESULT SCREEN
═══════════════════════════════════ */
.result-screen{
  flex:1;display:none;flex-direction:column;
  padding:28px 20px 32px;
  overflow-y:auto;gap:18px;
}

/* 상단 결과 헤더 */
.result-header{
  text-align:center;padding:24px;
  background:var(--color-bg-secondary);
  border-radius:var(--radius-xl);
  border:1px solid var(--color-border);
}
.result-emoji{font-size:52px;display:block;margin-bottom:10px}
.result-title{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:24px;font-weight:800;color:var(--color-text);
  letter-spacing:-.02em;margin-bottom:4px;
}
.result-sub{
  font-family:'DM Sans',sans-serif;
  font-size:14px;color:var(--color-text-muted);
}

/* 점수 원형 */
.ring-wrap{
  display:flex;flex-direction:column;align-items:center;
  margin-top:16px;
}
.ring-container{position:relative;display:inline-flex}
.ring-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-val{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:36px;font-weight:800;color:var(--color-primary);line-height:1;
}
.ring-label{
  font-family:'DM Sans',sans-serif;
  font-size:11px;color:var(--color-text-muted);margin-top:3px;
}

/* 통계 그리드 */
.stats-grid{
  display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;
}
.stat-card{
  text-align:center;padding:14px 8px;border-radius:var(--radius-xl);
}
.stat-card.g{background:var(--color-success-light);border:1px solid #A7F3D0}
.stat-card.r{background:var(--color-error-light);border:1px solid #FCA5A5}
.stat-card.t{background:var(--color-bg-secondary);border:1px solid var(--color-border)}
.stat-label{
  font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;
  color:var(--color-text-muted);margin-bottom:5px;
}
.stat-val{
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:32px;font-weight:800;line-height:1;
}
.stat-card.g .stat-val{color:var(--color-success)}
.stat-card.r .stat-val{color:var(--color-error)}
.stat-card.t .stat-val{color:var(--color-text);font-size:22px}

/* 오답 복습 */
.wrong-panel{
  border:1px solid var(--color-border);border-radius:var(--radius-xl);
  overflow:hidden;
}
.wrong-header{
  padding:11px 18px;background:var(--color-bg-secondary);
  border-bottom:1px solid var(--color-border);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-muted);
  display:flex;align-items:center;gap:6px;
}
.wrong-item{
  padding:16px 18px;border-bottom:1px solid var(--color-bg-tertiary);
}
.wrong-item:last-child{border-bottom:none}
.wrong-q{
  font-family:'Lora',serif;font-size:13px;font-weight:500;
  color:var(--color-text-secondary);margin-bottom:7px;line-height:1.55;
}
.wrong-my{
  font-family:'DM Sans',sans-serif;font-size:12px;
  color:var(--color-error);margin-bottom:3px;
  display:flex;align-items:flex-start;gap:5px;
}
.wrong-ans{
  font-family:'DM Sans',sans-serif;font-size:12px;
  color:var(--color-success);margin-bottom:9px;
  display:flex;align-items:flex-start;gap:5px;
}
.wrong-src{
  font-family:'Lora',serif;font-size:12px;color:var(--color-text-secondary);
  background:var(--color-active-light);
  border-left:3px solid var(--color-active);
  padding:9px 13px;border-radius:0 var(--radius-md) var(--radius-md) 0;
  line-height:1.75;
}
[data-theme="dark"] .wrong-src{background:rgba(245,158,11,.1)}
.wrong-src strong{color:var(--color-active);font-style:italic}

/* 결과 버튼들 */
.result-btns{display:flex;gap:10px}
.btn-secondary{
  flex:1;padding:13px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;
  border-radius:var(--radius-full);border:2px solid var(--color-primary);
  color:var(--color-primary);background:transparent;
  transition:all .15s;
}
.btn-secondary:hover{background:var(--color-primary-light)}
.btn-primary{
  flex:1;padding:13px;
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;font-weight:700;
  border-radius:var(--radius-full);border:none;
  color:#fff;background:var(--color-primary);
  box-shadow:0 3px 0 var(--color-primary-dark);
  transition:all .15s;
}
.btn-primary:hover{
  background:var(--color-primary-hover);
  box-shadow:0 5px 0 var(--color-primary-dark);
  transform:translateY(-1px);
}

/* ── 스크롤바 ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:99px}
</style>
</head>
<body>

<div class="app-shell">
  <!-- 상단 바 -->
  <div class="top-bar">
    <div class="top-bar-brand">
      <div class="top-bar-brand-dot"></div>
      LexiVault
    </div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- ① START SCREEN -->
  <div class="start-screen" id="startScreen">
    <!-- QUIZ 로고 -->
    <div class="quiz-logo-wrap">
      <span class="quiz-logo">QUIZ</span>
      <div class="quiz-logo-icons">
        <span class="quiz-logo-book">📚</span>
        <span class="quiz-logo-pencil">✏️</span>
      </div>
      <span class="quiz-logo-q">?</span>
    </div>

    <!-- 원문 정보 -->
    <div class="script-info-card">
      <div class="script-info-label">📄 원문 정보</div>
      <div class="script-info-title" id="scriptTitle">The Theory of Evolution</div>
      <div class="script-info-chapter" id="scriptChapter">Natural Selection & Adaptation</div>
      <div class="script-info-section" id="scriptSection">1. Core Concepts</div>
    </div>

    <!-- 메타 배지 -->
    <div class="meta-badges">
      <span class="badge badge-blue">📝 <span id="totalQBadge">5</span>문제</span>
      <span class="badge badge-gray">⏱ 3분</span>
      <span class="badge badge-green">🎯 4지선다</span>
    </div>

    <!-- Start 버튼 -->
    <button class="start-btn" onclick="startGame()">Start</button>
  </div>

  <!-- ② GAME SCREEN -->
  <div class="game-screen" id="gameScreen">
    <!-- HUD -->
    <div class="hud">
      <span class="hud-title">ScriptQuiz</span>
      <div class="hud-group">
        <span class="hud-ico">⏱</span>
        <span class="hud-lbl">TIME</span>
        <span class="hud-val" id="timeVal">3:00</span>
      </div>
      <div class="hud-group">
        <span class="hud-ico">🎯</span>
        <span class="hud-lbl">SCORE</span>
        <span class="hud-val" id="scoreVal">0/5</span>
      </div>
    </div>
    <!-- 진행 바 -->
    <div class="progress-wrap">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>

    <!-- 문제 + 선택지 -->
    <div class="question-wrap" id="questionWrap">
      <!-- 문제 메타 -->
      <div class="q-meta">
        <span class="q-num" id="qNum">Q 1 / 5</span>
        <span class="q-type-badge" id="qType">4지선다</span>
      </div>
      <!-- 문제 박스 -->
      <div class="q-box">
        <div class="q-text" id="qText"></div>
        <div class="q-hint" id="qHint" style="display:none">💡 원문에서 힌트를 찾아보세요</div>
      </div>
      <!-- 선택지 -->
      <div class="options" id="optionsWrap"></div>

      <!-- O/X 피드백 오버레이 -->
      <div class="feedback-layer" id="feedbackLayer">
        <div class="feedback-box" id="feedbackBox">
          <div class="fb-o" id="fbO" style="display:none"></div>
          <div class="fb-x" id="fbX" style="display:none">✕</div>
        </div>
      </div>
    </div>

    <!-- Next 버튼 -->
    <div class="next-wrap">
      <button class="next-btn" id="nextBtn" disabled onclick="nextQuestion()">
        Next →
      </button>
    </div>
  </div>

  <!-- ③ RESULT SCREEN -->
  <div class="result-screen" id="resultScreen">
    <!-- 결과 헤더 -->
    <div class="result-header">
      <span class="result-emoji" id="resultEmoji">🏆</span>
      <div class="result-title" id="resultTitle">Excellent!</div>
      <div class="result-sub" id="resultSub">훌륭한 독해 실력이에요!</div>

      <!-- 점수 원형 -->
      <div class="ring-wrap">
        <div class="ring-container">
          <svg width="130" height="130" viewBox="0 0 130 130">
            <circle cx="65" cy="65" r="54"
              fill="none" stroke="var(--color-bg-tertiary)" stroke-width="9"/>
            <circle cx="65" cy="65" r="54"
              fill="none" stroke="var(--color-primary)" stroke-width="9"
              stroke-linecap="round"
              stroke-dasharray="339.3"
              stroke-dashoffset="339.3"
              transform="rotate(-90 65 65)"
              id="scoreRing"
              style="transition:stroke-dashoffset 1s var(--ease-out)"/>
          </svg>
          <div class="ring-center">
            <div class="ring-val" id="ringVal">0%</div>
            <div class="ring-label">정확도</div>
          </div>
        </div>
      </div>
    </div>

    <!-- 통계 -->
    <div class="stats-grid">
      <div class="stat-card g">
        <div class="stat-label">✓ 정답</div>
        <div class="stat-val" id="rCorrect">0</div>
      </div>
      <div class="stat-card r">
        <div class="stat-label">✕ 오답</div>
        <div class="stat-val" id="rWrong">0</div>
      </div>
      <div class="stat-card t">
        <div class="stat-label">⏱ 시간</div>
        <div class="stat-val" id="rTime">—</div>
      </div>
    </div>

    <!-- 오답 복습 -->
    <div class="wrong-panel" id="wrongPanel" style="display:none">
      <div class="wrong-header">📌 오답 복습</div>
      <div id="wrongList"></div>
    </div>

    <!-- 버튼 -->
    <div class="result-btns">
      <button class="btn-secondary" onclick="restartGame()">🔄 다시 풀기</button>
      <button class="btn-primary" onclick="goVocab()">📖 단어장 보기</button>
    </div>
  </div>
</div>

<script>
/* ── 데이터 ── */
var QUESTIONS = [
  {
    q: "What is NOT a key mechanism of natural selection?",
    type: "4지선다",
    options: [
      "Variation among individuals in a population",
      "Inheritance of traits from parents to offspring",
      "Equal survival rates regardless of traits",
      "Differential reproductive success based on traits"
    ],
    correct: 2,
    source: "Natural selection requires variation among individuals, inheritance of those variations, and differential survival and reproduction based on those traits.",
    keywords: ["Equal survival rates"]
  },
  {
    q: "According to the text, what does 'adaptation' mean in evolutionary biology?",
    type: "4지선다",
    options: [
      "The ability of an organism to change its DNA voluntarily",
      "A trait that increases an organism's fitness in its environment",
      "The process by which species become extinct",
      "A sudden change in an organism's behavior"
    ],
    correct: 1,
    source: "An adaptation is a trait that has evolved because it increases an organism's fitness — its ability to survive and reproduce in its environment.",
    keywords: ["fitness", "survive and reproduce"]
  },
  {
    q: "Which of the following best describes 'survival of the fittest'?",
    type: "4지선다",
    options: [
      "Only the physically strongest organisms survive",
      "Organisms best adapted to their environment reproduce more successfully",
      "Larger organisms always outlive smaller ones",
      "Faster organisms always escape predators"
    ],
    correct: 1,
    source: "'Survival of the fittest' means that organisms best suited to their environment are more likely to survive and pass on their genes to the next generation.",
    keywords: ["best suited", "survive", "pass on their genes"]
  },
  {
    q: "What role do mutations play in evolution?",
    type: "4지선다",
    options: [
      "They always harm the organism that carries them",
      "They provide the raw genetic variation that natural selection acts upon",
      "They only occur in response to environmental pressure",
      "They are immediately beneficial to all organisms"
    ],
    correct: 1,
    source: "Mutations introduce new genetic variations into a population, providing the raw material upon which natural selection can act.",
    keywords: ["new genetic variations", "raw material"]
  },
  {
    q: "How does geographic isolation contribute to speciation?",
    type: "4지선다",
    options: [
      "It causes organisms to immediately develop new traits",
      "It prevents gene flow, allowing populations to evolve independently",
      "It forces organisms to compete more intensely",
      "It increases the mutation rate in isolated populations"
    ],
    correct: 1,
    source: "When populations become geographically isolated, gene flow between them stops. Each population then evolves independently, potentially leading to the formation of new species.",
    keywords: ["gene flow", "evolve independently", "new species"]
  }
];

/* ── 상태 ── */
var state = {
  screen: 'start',
  currentQ: 0,
  selected: -1,
  answered: false,
  correct: 0,
  wrong: 0,
  wrongItems: [],
  timeLeft: 180,
  timer: null,
  startTime: null,
  elapsed: 0
};

/* ── 유틸 ── */
function $(id){ return document.getElementById(id) }
function fmt(s){ var m=Math.floor(s/60),sc=s%60; return m+':'+(sc<10?'0':'')+sc }
function toggleTheme(){
  var d=document.documentElement;
  var dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',dark?'light':'dark');
  $('themeBtn').textContent=dark?'🌙':'☀️';
}

/* ── 게임 시작 ── */
function startGame(){
  state.currentQ=0; state.correct=0; state.wrong=0;
  state.wrongItems=[]; state.timeLeft=180;
  state.startTime=Date.now();

  $('startScreen').style.display='none';
  $('resultScreen').style.display='none';
  var gs=$('gameScreen'); gs.style.display='flex';

  startTimer();
  renderQuestion();
}

function startTimer(){
  clearInterval(state.timer);
  state.timer=setInterval(function(){
    state.timeLeft--;
    updateHUD();
    if(state.timeLeft<=0){ clearInterval(state.timer); endGame(); }
  },1000);
}

function updateHUD(){
  var tv=$('timeVal');
  tv.textContent=fmt(state.timeLeft);
  tv.className='hud-val'+(state.timeLeft<=30?' danger':'');
  $('scoreVal').textContent=state.correct+'/'+QUESTIONS.length;
  $('progressBar').style.width=(state.currentQ/QUESTIONS.length*100)+'%';
}

/* ── 문제 렌더 ── */
function renderQuestion(){
  var q=QUESTIONS[state.currentQ];
  state.selected=-1; state.answered=false;

  $('qNum').textContent='Q '+(state.currentQ+1)+' / '+QUESTIONS.length;
  $('qType').textContent=q.type;
  $('qText').textContent=q.q;
  $('qHint').style.display='none';

  var nb=$('nextBtn');
  nb.className='next-btn';nb.disabled=true;
  nb.textContent=(state.currentQ===QUESTIONS.length-1)?'결과 보기 →':'Next →';

  var ow=$('optionsWrap');
  ow.innerHTML='';
  var labels=['a','b','c','d'];
  q.options.forEach(function(opt,i){
    var btn=document.createElement('button');
    btn.className='option';
    btn.innerHTML=
      '<div class="opt-chk" id="chk'+i+'"></div>'+
      '<div class="opt-lbl">'+labels[i]+'</div>'+
      '<div class="opt-text">'+opt+'</div>';
    btn.onclick=function(){ selectOption(i) };
    ow.appendChild(btn);
  });

  updateHUD();
}

/* ── 선택 ── */
function selectOption(idx){
  if(state.answered) return;
  state.selected=idx;
  state.answered=true;

  var q=QUESTIONS[state.currentQ];
  var isCorrect=(idx===q.correct);
  var btns=document.querySelectorAll('.option');

  if(isCorrect){ state.correct++; }
  else { state.wrong++; state.wrongItems.push({q:q,selected:idx}); }

  btns.forEach(function(b,i){
    b.onclick=null;
    if(i===q.correct) b.classList.add('correct');
    else if(i===idx && !isCorrect) b.classList.add('wrong');
    else b.classList.add('dim');
  });

  // 체크박스 아이콘
  var chk=document.getElementById('chk'+idx);
  if(isCorrect){
    chk.innerHTML='<svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="#FFE234" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  } else {
    chk.innerHTML='<span style="color:#fff;font-size:12px;font-weight:800;line-height:1">✕</span>';
    // 정답 체크박스도 업데이트
    var correctChk=document.getElementById('chk'+q.correct);
    if(correctChk){
      correctChk.innerHTML='<svg width="13" height="10" viewBox="0 0 13 10" fill="none"><path d="M1.5 5L5 8.5L11.5 1.5" stroke="#FFE234" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
  }

  showFeedback(isCorrect);

  var nb=$('nextBtn');
  nb.className='next-btn active'; nb.disabled=false;
}

/* ── O/X 피드백 ── */
function showFeedback(ok){
  var layer=$('feedbackLayer');
  var fbO=$('fbO'), fbX=$('fbX');
  fbO.style.display=ok?'block':'none';
  fbX.style.display=ok?'none':'block';
  layer.classList.add('show');
  // 박스 재애니메이션
  var box=$('feedbackBox');
  box.style.animation='none';
  setTimeout(function(){ box.style.animation='' },10);
  setTimeout(function(){ layer.classList.remove('show') },800);
}

/* ── 다음 문제 ── */
function nextQuestion(){
  if(state.currentQ===QUESTIONS.length-1){ endGame(); return; }
  state.currentQ++;
  renderQuestion();
}

/* ── 게임 종료 ── */
function endGame(){
  clearInterval(state.timer);
  state.elapsed=Math.round((Date.now()-state.startTime)/1000);
  $('gameScreen').style.display='none';
  showResult();
}

function showResult(){
  var rs=$('resultScreen');
  rs.style.display='flex';

  var total=QUESTIONS.length;
  var acc=state.correct/total;
  var pct=Math.round(acc*100);

  // 이모지 + 메시지
  var emoji, title, sub;
  if(pct>=80){ emoji='🏆'; title='Excellent!'; sub='완벽에 가까운 독해 실력이에요!' }
  else if(pct>=60){ emoji='👏'; title='Good Job!'; sub='꽤 훌륭해요! 조금만 더 연습해봐요.' }
  else if(pct>=40){ emoji='💪'; title='Keep Going!'; sub='포기하지 마세요. 다시 도전해봐요!' }
  else { emoji='📖'; title='Try Again!'; sub='원문을 다시 읽고 도전해보세요.' }

  $('resultEmoji').textContent=emoji;
  $('resultTitle').textContent=title;
  $('resultSub').textContent=sub;
  $('rCorrect').textContent=state.correct;
  $('rWrong').textContent=state.wrong;
  $('rTime').textContent=fmt(state.elapsed);
  $('ringVal').textContent=pct+'%';

  // 원형 애니메이션
  setTimeout(function(){
    var circumference=2*Math.PI*54;
    $('scoreRing').style.strokeDashoffset=circumference*(1-acc);
  },100);

  // 오답 복습
  if(state.wrongItems.length>0){
    $('wrongPanel').style.display='block';
    var html='';
    state.wrongItems.forEach(function(item){
      var q=item.q;
      html+=
        '<div class="wrong-item">'+
          '<div class="wrong-q">Q. '+q.q+'</div>'+
          '<div class="wrong-my">'+
            '<span>✕</span>'+
            '<span>내 답: '+q.options[item.selected]+'</span>'+
          '</div>'+
          '<div class="wrong-ans">'+
            '<span>✓</span>'+
            '<span>정답: '+q.options[q.correct]+'</span>'+
          '</div>'+
          '<div class="wrong-src">'+
            highlightSrc(q.source, q.keywords)+
          '</div>'+
        '</div>';
    });
    $('wrongList').innerHTML=html;
  } else {
    $('wrongPanel').style.display='none';
  }
}

function highlightSrc(src, keywords){
  var result=src;
  if(keywords){
    keywords.forEach(function(kw){
      result=result.replace(new RegExp('('+kw+')','gi'),'<strong>$1</strong>');
    });
  }
  return result;
}

function restartGame(){ startGame() }
function goVocab(){ alert('단어장 화면으로 이동합니다.') }

// 초기 렌더
$('totalQBadge').textContent=QUESTIONS.length;
</script>
</body>
</html>
