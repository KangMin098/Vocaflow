  <h1>교정 부호</h1>
  <p class="thesis">모든 삽화의 큰 도형이 교정지(시험지 단)이고, 주묵은 교정자의 붓처럼 한 획만 긋는다. 그 한 획은 형태 문법의 뜻(지지·배제·유인·합류) 가운데 하나다.</p>
  <p class="sig"><span>서명</span> 주묵 한 획 — 종이 위 근거에서 목적지로 긋는 실선+화살표</p>
