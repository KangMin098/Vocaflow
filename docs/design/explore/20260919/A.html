  <h1>원고지</h1>
  <p class="thesis">모든 삽화의 큰 도형이 원고지 한 장이다. 무대의 모눈이 곧 원고지 칸이 되어, 낱말이 칸에 들어가고 모르는 칸이 칠해진다 — 지문 채색(랜딩·/fit 서명)과 같은 몸짓을 종이 위에서 한다.</p>
  <p class="sig"><span>서명</span> 원고지 칸 — 모르는 낱말의 칸만 칠해진다(주묵 붓 자국은 "지금" 한 칸)</p>
