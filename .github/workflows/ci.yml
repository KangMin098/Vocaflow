name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 모든 base 의 PR — 종속 PR(base ≠ main)에도 필수 CI 가 돌아야 safe-merge 가 판정할 수 있다(정책 v1.1 · 2026-10-11)
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 두 에이전트 설정 불변식(AGENTS.md 단일 출처 · MCP 생성물 드리프트 · 비밀값 0) + 훅·잠금·인수인계 회귀
      - run: node agents/scripts/check.mjs
      - run: node --test agents/scripts/__tests__/*.test.mjs

      # ⚠️ **실 DB 통합 테스트에 시크릿을 넘긴다.**
      #
      # 이 저장소에는 실 DB 를 치는 회귀가 24개 있고(2026-08-26 실측) 그중에는
      # **권한 상승·RLS 회귀**가 들어 있다(privilege-escalation · rls-surface ·
      # word-set-rls · session-rls · assignment-rls). 전부 skipIf(env 없음) 이라,
      # env 를 안 넘기면 CI 에서 **조용히 전량 건너뛴다** — 초록불인데 아무것도 안 본 상태다.
      #
      # 시크릿이 없는 저장소에서는 지금과 똑같이 skip 된다(빈 문자열 → skipIf). 안전하다.
      # 넣는 순간부터 24개가 CI 에서 실제로 돈다.
      - run: pnpm turbo run lint typecheck test
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  # v06.92 — 프로덕션 next build 회귀 가드.
  # 빌드가 minify/컴파일 단계에서 깨지지 않는지 검증(이번 복구 PR 이전엔 main 빌드가 실패했음).
  # 실 백엔드 불요: force-dynamic 페이지는 build-time 에 미실행 → placeholder env 로 충분
  # (CI 시뮬레이션으로 .env.local 없이 green 확인). lint 는 verify job 이 담당.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role
          OPENAI_API_KEY: sk-placeholder

  # ── 런타임 회귀 (e2e) ──
  # 왜 필요한가: 이 저장소의 결함 중 여러 건이 **단위 테스트를 전부 통과한 채**
  # 살아 있었다. 정적 검사가 원리적으로 못 보는 것들이다 —
  #   · 입력 무단 절단 (textarea maxLength 가 붙여넣은 글의 75%를 조용히 버림)
  #   · 가로 넘침 (390px 에서 도서관이 화면 두 배 폭)
  #   · 터치 타겟 (정적 추정 78건 vs 실측 196건 — 2.5배)
  # 실제로 렌더해서 재는 검사만이 이 계층을 잡는다.
  #
  # ⚠️ 이 잡은 **저장소 시크릿이 있어야 돈다**. 없으면 조용히 건너뛴다(빨간불 대신).
  #    활성화하려면 Settings → Secrets 에 아래 3개를 넣을 것:
  #      NEXT_PUBLIC_SUPABASE_URL · NEXT_PUBLIC_SUPABASE_ANON_KEY · SUPABASE_SERVICE_ROLE_KEY
  #    (SERVICE_ROLE 은 DB 단언용 — 없으면 UI 검증만 하고 DB 단언은 건너뛴다)
  # 공유 개발 DB 통합 E2E(신뢰 경로) — 저장소 시크릿 필요 · PR 에서는 돌지 않는다(PR 필수는 아래 격리 e2e). main push · 수동 실행만
  e2e-shared-dev:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 시크릿 유무 확인
        id: guard
        run: |
          if [ -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::e2e 건너뜀 — 저장소 시크릿 미설정. Settings → Secrets 에 NEXT_PUBLIC_SUPABASE_URL 등을 넣으면 활성화됩니다."
          fi

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium

      - if: steps.guard.outputs.ready == 'true'
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # playwright.config 의 webServer 는 `process.env.CI` 일 때 undefined 다 —
      # CI 에서는 **서버가 이미 떠 있다고 가정**한다. 그래서 여기서 직접 띄우고 기다린다.
      # (이 단계를 빠뜨리면 e2e 가 접속 실패로 전부 깨진다)
      - if: steps.guard.outputs.ready == 'true'
        name: 앱 기동 후 대기
        run: |
          pnpm --filter web exec next start -p 3000 &
          npx --yes wait-on http://localhost:3000 --timeout 120000
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # 상시 스펙만 돈다 — 학습 루프 완주 · 추출 신뢰 · 추출 스케일 · a11y 전수 스윕 ·
      # **공개 표면**(33-public-surface: 비로그인 검색 착지점. a11y 스윕은 동적 라우트를
      # 건너뛰고 로그인 상태로 돌아서 콘텐츠 상세 278개를 한 번도 보지 못했다).
      # a11y 스윕은 베이스라인 방식이라 **오늘부터의 악화만** 실패시킨다.
      - if: steps.guard.outputs.ready == 'true'
        run: pnpm --filter web exec playwright test 04-ui-smoke 08-text-extract-trust 09-text-extract-scale 10-a11y-sweep 33-public-surface
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # 검증 계정 비밀번호 — 코드에 대체값이 없다(2026-09-19 교체, design/DECISIONS DD-48). 저장소 시크릿에서만 받는다
          PLAYWRIGHT_RUNTIME_PASSWORD: ${{ secrets.PLAYWRIGHT_RUNTIME_PASSWORD }}

      - if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shared-dev-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  # PR 필수 e2e(격리 · 정책 v1.1 · 2026-10-11) — 저장소 시크릿 · 공유 개발 DB 없이:
  #   러너 안 로컬 Supabase(supabase start · 로컬 데모 키) → 저장소 마이그레이션 실제 적용(파일별 · 기준 목록 밖 실패 = 실패)
  #   → 실제 Next.js 빌드 · 기동 → Playwright 실제 브라우저 → DB 단언(목표 행 · RLS) → 러너와 함께 폐기
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 마이그레이션은 자동 적용하지 않고(첫 실패에서 멈춘다) 빈 DB 로 띄운 뒤 파일별로 적용한다
      - name: 격리 Supabase 기동(빈 DB)
        run: |
          mv supabase/migrations supabase/_all_migrations
          mkdir supabase/migrations
          supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime,storage-api
          supabase status -o env > /tmp/sb.env
          grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL)=' /tmp/sb.env | sed 's/^/LOCAL_/' >> "$GITHUB_ENV"

      - name: 저장소 마이그레이션 적용(파일별)
        run: bash scripts/ci/apply-migrations.sh supabase/_all_migrations "$(grep '^DB_URL=' /tmp/sb.env | cut -d= -f2- | tr -d '"')"

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter web exec playwright install --with-deps chromium

      - name: 격리 환경 변수(로컬 데모 키 — 비밀값 아님)
        run: |
          strip() { echo "$1" | tr -d '"'; }
          echo "NEXT_PUBLIC_SUPABASE_URL=$(strip "$LOCAL_API_URL")" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(strip "$LOCAL_ANON_KEY")" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(strip "$LOCAL_SERVICE_ROLE_KEY")" >> "$GITHUB_ENV"

      # 비민감 fixture — 학습 지도 정의(저장소의 공개 JSON scripts/csat/map/source/*). 학습자 · 시험 기록은 넣지 않는다(테스트가 만든다)
      - name: 격리 fixture 적재(학습 지도 정의)
        run: |
          case "$NEXT_PUBLIC_SUPABASE_URL" in http://127.0.0.1:54321*) ;; *) echo "::error::격리 DB 가 아니다"; exit 1 ;; esac
          node scripts/csat/map/seed.mjs --commit

      - run: pnpm --filter web build

      - name: 앱 기동 후 대기
        run: |
          pnpm --filter web exec next start -p 3000 > /tmp/next.log 2>&1 &
          npx --yes wait-on http://localhost:3000 --timeout 120000

      - name: 격리 E2E(실제 브라우저 + DB 단언)
        run: pnpm --filter web exec playwright test -c playwright.isolated.config.ts

      - if: always()
        name: 서버 로그
        run: tail -n 80 /tmp/next.log || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-isolated-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report-isolated/
            migration-failures.txt
          retention-days: 7

      - if: always()
        name: 격리 환경 폐기
        run: supabase stop --no-backup || true
